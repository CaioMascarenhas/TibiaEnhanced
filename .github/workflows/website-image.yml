name: Website Docker image

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-image.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ./website
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/caiomascarenhas/tibiaenhanced-web:latest
            ghcr.io/caiomascarenhas/tibiaenhanced-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CaioMascarenhas/TibiaEnhanced
            org.opencontainers.image.description=Site do Tibia Enhanced
          cache-from: type=gha
          cache-to: type=gha,mode=max
