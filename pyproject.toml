[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tibiaenhanced"
version = "0.1.0"
description = "Recortes ao vivo e alertas locais para Tibia"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.gui-scripts]
tibiaenhanced = "tibiaenhanced.app:main"

[tool.setuptools.packages.find]
where = ["src"]
