[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tibiaenhanced"
version = "0.1.0"
description = "Recortes ao vivo e alertas locais para Tibia"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "mss>=10,<11"]

[project.optional-dependencies]
diagnostics = ["windows-capture==2.0.1"]

[project.gui-scripts]
tibiaenhanced = "tibiaenhanced.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tibiaenhanced = ["audios/*.mp3", "audios/*.wav", "imgs/**/*.png", "imgs/*.png", "fonts/*.ttf", "fonts/*.txt", "icons/*.svg", "icons/LICENSE"]
